version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════════
#  MediBot — Production Docker Compose Stack
#
#  Services:
#    web      — Flask app (Gunicorn + gevent)
#    nginx    — Reverse proxy + SSL termination
#    db       — PostgreSQL 15
#    redis    — Shared cache + rate-limiter state
#
#  Quick start (SQLite + memory cache — local dev only):
#    docker-compose up web
#
#  Full production stack:
#    docker-compose --env-file .env up -d
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── Flask Application ───────────────────────────────────────────────────────
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - FLASK_DEBUG=false
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://medibot:${POSTGRES_PASSWORD}@db:5432/medibot
      - REDIS_URL=redis://redis:6379/0
    # Do NOT expose 8080 to the internet — only Nginx should connect to it
    expose:
      - "8080"
    volumes:
      - app_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro          # Mount your SSL certs here
      - /var/www/certbot:/var/www/certbot # Let's Encrypt ACME challenge
    depends_on:
      web:
        condition: service_healthy

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       medibot
      POSTGRES_USER:     medibot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medibot"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Do NOT expose port 5432 to the internet
    expose:
      - "5432"

  # ── Redis Cache + Rate Limiter ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-changeme_redis_password}
      --bind 0.0.0.0
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    expose:
      - "6379"

  # ── DB Migration runner (runs once at start) ─────────────────────────────────
  migrate:
    build: .
    command: flask db upgrade
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://medibot:${POSTGRES_PASSWORD}@db:5432/medibot
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  app_logs:
