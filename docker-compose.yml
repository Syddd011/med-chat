version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════════
#  MediBot — Production Docker Compose Stack
#
#  Services:
#    web      — Flask app (Gunicorn)
#    nginx    — Reverse proxy + SSL termination
#    db       — PostgreSQL (optional; default is SQLite)
#    redis    — Response cache (optional; default is memory)
#
#  Quick start (SQLite + memory cache — no extra services):
#    docker-compose up web
#
#  Full production stack:
#    docker-compose up
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── Flask Application ───────────────────────────────────────────────────────
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - FLASK_DEBUG=false
      - DATABASE_URL=postgresql://medibot:${POSTGRES_PASSWORD}@db:5432/medibot
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8080:8080"
    volumes:
      - ./flask.log:/app/flask.log
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro        # Mount your SSL certs here
    depends_on:
      - web

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       medibot
      POSTGRES_USER:     medibot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medibot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

# ── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
