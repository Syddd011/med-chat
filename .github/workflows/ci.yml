name: MediBot CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Lint & Test ─────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          # Stop on syntax errors / undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=.git,__pycache__,migrations,data,models
          # Warnings only (do not fail)
          flake8 . --count --exit-zero --max-complexity=12 --max-line-length=120 \
            --statistics --exclude=.git,__pycache__,migrations,data,models

      - name: Run tests
        env:
          PINECONE_API_KEY:    ${{ secrets.PINECONE_API_KEY }}
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          FLASK_SECRET_KEY:    ci-test-secret-key-not-real
          DATABASE_URL:        sqlite:///test_medibot.db
          ADMIN_EMAIL:         admin@test.com
        run: |
          pip install pytest
          pytest tests/ -v --tb=short

  # ── Build Docker Image ───────────────────────────────────────────────────────
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/medibot:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/medibot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

