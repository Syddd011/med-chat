<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medical Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="chat-card">

    <!-- ── Header ── -->
    <header class="chat-header">
      <div class="header-avatar">
        🩺
        <span class="online-dot"></span>
      </div>
      <div class="header-info">
        <div class="header-name">Medical Chatbot</div>
        <div class="header-sub">Ask me anything!</div>
      </div>
    </header>

    <!-- ── Welcome ── -->
    <div class="chat-welcome">
      <div class="welcome-greeting">Hello there 👋</div>
      <h1 class="welcome-headline">
        I'm your <em>AI Health Consultant</em> —<br>
        How can I help you today?
      </h1>
    </div>

    <!-- ── Messages ── -->
    <div class="chat-messages" id="chatMessages">

      <!-- User message -->
      <div class="msg-row user">
        <div class="msg-avatar user-av">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
          </svg>
        </div>
        <div class="msg-group">
          <div class="bubble">hi</div>
          <div class="msg-time">15:29</div>
        </div>
      </div>

      <!-- Bot message -->
      <div class="msg-row bot">
        <div class="msg-avatar bot-av">🩺</div>
        <div class="msg-group">
          <div class="bubble">I don't know based on the provided documents.</div>
          <div class="msg-time">15:29</div>
        </div>
      </div>

      <!-- User message -->
      <div class="msg-row user">
        <div class="msg-avatar user-av">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
          </svg>
        </div>
        <div class="msg-group">
          <div class="bubble">hi</div>
          <div class="msg-time">15:43</div>
        </div>
      </div>

      <!-- Bot message -->
      <div class="msg-row bot">
        <div class="msg-avatar bot-av">🩺</div>
        <div class="msg-group">
          <div class="bubble">I don't know based on the provided documents.</div>
          <div class="msg-time">15:43</div>
        </div>
      </div>

      <!-- Typing indicator (hidden by default) -->
      <div class="msg-row bot" id="typingRow" style="display:none;">
        <div class="msg-avatar bot-av">🩺</div>
        <div class="typing">
          <span></span><span></span><span></span>
        </div>
      </div>

    </div><!-- /chat-messages -->

    <!-- ── Input Bar ── -->
    <div class="chat-input-wrap">
      <div class="chat-input-row">

        <!-- Attach -->
        <button class="attach-btn" title="Attach file" onclick="document.getElementById('fileInput').click()">
          <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66L9.41 17.41a2 2 0 01-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <input type="file" id="fileInput" style="display:none;" />

        <!-- Text input -->
        <input
          class="chat-input"
          id="chatInput"
          type="text"
          placeholder="Type your message..."
          autocomplete="off"
        />

        <!-- Send -->
        <button class="send-btn" id="sendBtn" title="Send">
          <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>

      </div>
    </div>

  </div><!-- /chat-card -->

  <script>
    const messagesEl  = document.getElementById('chatMessages');
    const inputEl     = document.getElementById('chatInput');
    const sendBtn     = document.getElementById('sendBtn');
    const typingRow   = document.getElementById('typingRow');

    function getTime() {
      const now = new Date();
      return `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
    }

    function scrollBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendMessage(text, role) {
      const row = document.createElement('div');
      row.className = `msg-row ${role}`;

      const avatarHTML = role === 'user'
        ? `<div class="msg-avatar user-av">
             <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
               <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
             </svg>
           </div>`
        : `<div class="msg-avatar bot-av">🩺</div>`;

      row.innerHTML = `
        ${avatarHTML}
        <div class="msg-group">
          <div class="bubble">${text}</div>
          <div class="msg-time">${getTime()}</div>
        </div>
      `;

      messagesEl.insertBefore(row, typingRow);
      scrollBottom();
    }

    function showTyping(show) {
      typingRow.style.display = show ? 'flex' : 'none';
      scrollBottom();
    }

    function botReply(userText) {
      showTyping(true);
      setTimeout(() => {
        showTyping(false);
        const lower = userText.toLowerCase();
        let reply = "I'm here to help with health-related questions. Could you be more specific?";
        if (lower.includes('hello') || lower.includes('hi') || lower.includes('hey'))
          reply = "Hello! I'm your AI Health Consultant. How can I assist you today?";
        else if (lower.includes('fever') || lower.includes('temperature'))
          reply = "A fever is often a sign your body is fighting an infection. Stay hydrated and rest. If it exceeds 39.4°C (103°F) for more than two days, please consult a doctor.";
        else if (lower.includes('headache'))
          reply = "Headaches can have many causes — stress, dehydration, or lack of sleep. Try resting in a quiet dark room and drink water. If severe or recurring, please see a physician.";
        else if (lower.includes('pain'))
          reply = "Pain can vary greatly. Could you describe where the pain is and how long you've had it? That will help me give you more relevant information.";
        else if (lower.includes('thanks') || lower.includes('thank you'))
          reply = "You're welcome! Stay healthy. Feel free to ask anything anytime. 😊";
        appendMessage(reply, 'bot');
      }, 1400);
    }

    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      appendMessage(text, 'user');
      inputEl.value = '';
      botReply(text);
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
  </script>

</body>
</html>
