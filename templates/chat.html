<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medical Chatbot</title>

    <!-- Bootstrap + Icons -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://use.fontawesome.com/releases/v5.5.0/css/all.css"
          integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU"
          crossorigin="anonymous">

    <!-- Your custom styles -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="medchat-body">
    <div class="container-fluid h-100">
        <div class="row h-100 justify-content-center align-items-center">
            <div class="col-12 col-md-8 col-xl-6">
                <div class="card medchat-card shadow-lg border-0">

                    <!-- Header -->
                    <div class="card-header medchat-header d-flex align-items-center">
                        <div class="medchat-avatar">
                            <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png"
                                 alt="Doctor avatar"
                                 class="medchat-avatar-img">
                            <span class="medchat-status-dot"></span>
                        </div>
                        <div class="medchat-header-text">
                            <h1 class="medchat-title mb-0">Medical Chatbot</h1>
                            <p class="medchat-subtitle mb-0">Ask me anything!</p>
                        </div>
                    </div>

                    <!-- Messages -->
                    <div id="messageFormeight"
                         class="card-body medchat-messages">
                        <!-- Chat bubbles will be added here -->
                    </div>

                    <!-- Input -->
                    <div class="card-footer medchat-footer" style="flex-direction: column;">
                        <!-- Image Preview -->
                        <div id="image-preview-container" class="mb-2" style="display:none; position: relative; width: fit-content;">
                            <img id="image-preview" src="" style="max-height:80px; border-radius:10px; border: 2px solid white;">
                            <button type="button" id="remove-image-btn" class="btn btn-sm btn-danger" style="position: absolute; top: -10px; right: -10px; border-radius: 50%; padding: 2px 6px;">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <form id="messageArea" class="input-group">
                            <input type="file" id="image-upload" name="image" accept="image/*" style="display:none">
                            <button type="button" id="upload-btn" class="btn medchat-send-btn attach_btn" style="border-radius: 20px 0 0 20px;">
                                <i class="fas fa-paperclip"></i>
                            </button>
                            <input type="text"
                                   id="text"
                                   name="msg"
                                   placeholder="Type your message..."
                                   autocomplete="off"
                                   class="form-control type_msg medchat-input"
                                   style="border-radius: 0;">
                            <div class="input-group-append">
                                <button type="submit"
                                        id="send"
                                        class="btn medchat-send-btn send_btn">
                                    <i class="fas fa-location-arrow"></i>
                                </button>
                            </div>
                        </form>
                    </div>

                </div><!-- /.card -->
            </div>
        </div>
    </div>

    <!-- Dependencies -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script
      src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"
      integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
      crossorigin="anonymous"></script>

    <!-- Original chat JS (unchanged logic) -->
    <script>
        $(document).ready(function () {
            let selectedImageFile = null;
            let selectedImageDataUrl = null;

            $("#upload-btn").click(function() {
                $("#image-upload").click();
            });

            $("#image-upload").change(function(e) {
                if (e.target.files && e.target.files[0]) {
                    selectedImageFile = e.target.files[0];
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        selectedImageDataUrl = e.target.result;
                        $("#image-preview").attr('src', e.target.result);
                        $("#image-preview-container").show();
                    }
                    reader.readAsDataURL(selectedImageFile);
                }
            });

            $("#remove-image-btn").click(function() {
                selectedImageFile = null;
                selectedImageDataUrl = null;
                $("#image-upload").val("");
                $("#image-preview-container").hide();
            });

            $("#messageArea").on("submit", function (event) {
                event.preventDefault(); // stop form from reloading page

                const date = new Date();
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');
                const str_time = hour + ":" + minute;

                var rawText = $("#text").val().trim();
                
                // Allow empty text if image is provided
                if (!rawText && !selectedImageFile) {
                    return; 
                }

                var chatContent = rawText;
                if (selectedImageDataUrl) {
                    chatContent = '<img src="' + selectedImageDataUrl + '" style="max-width: 150px; border-radius: 10px; margin-bottom: 5px;"><br>' + rawText;
                }

                var userHtml =
                    '<div class="d-flex justify-content-end mb-4">' +
                        '<div class="msg_cotainer_send">' +
                            chatContent +
                            '<span class="msg_time_send">' + str_time + '</span>' +
                        '</div>' +
                        '<div class="img_cont_msg">' +
                            '<img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" ' +
                                 'class="rounded-circle user_img_msg" alt="You">' +
                        '</div>' +
                    '</div>';

                $("#text").val("");
                $("#messageFormeight").append(userHtml);

                var messages = document.getElementById("messageFormeight");
                messages.scrollTop = messages.scrollHeight;

                var formData = new FormData();
                formData.append("msg", rawText);
                if (selectedImageFile) {
                    formData.append("image", selectedImageFile);
                }

                // Clean up the upload UI immediately
                $("#remove-image-btn").click();

                $.ajax({
                    data: formData,
                    type: "POST",
                    url: "/get",
                    processData: false,
                    contentType: false
                }).done(function (data) {
                    var botHtml =
                        '<div class="d-flex justify-content-start mb-4">' +
                            '<div class="img_cont_msg">' +
                                '<img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" ' +
                                     'class="rounded-circle user_img_msg" alt="Bot">' +
                            '</div>' +
                            '<div class="msg_cotainer">' +
                                data +
                                '<span class="msg_time">' + str_time + '</span>' +
                            '</div>' +
                        '</div>';

                    $("#messageFormeight").append(botHtml);
                    messages.scrollTop = messages.scrollHeight;
                });
            });
        });
    </script>
</body>
</html>
