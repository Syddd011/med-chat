<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server Error — MediBot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { background: #0a1628; color: #b0bec5; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 24px; }
    .err-box { max-width: 420px; }
    .err-code { font-size: 96px; font-weight: 700; color: #ff4d4f; line-height: 1; margin-bottom: 16px; }
    h1 { font-size: 24px; color: #e8f0fe; margin-bottom: 12px; }
    p { color: #90a4ae; margin-bottom: 28px; }
    a { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #00e5a0, #00b8d4); color: #0a1628; border-radius: 10px; font-weight: 600; text-decoration: none; }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="err-box">
    <div class="err-code">500</div>
    <h1>Something Went Wrong</h1>
    <p>We encountered a temporary server issue. Our team has been notified. Please try again in a moment.</p>
    <a href="/">← Back to MediBot</a>
  </div>
</body>
</html>
